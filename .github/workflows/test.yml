name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tools
        run: python -m pip install --upgrade pip pytest build
      - name: Test package
        run: python -m pytest -q
      - name: Verify database
        run: python -m sapera --check-db
      - name: Verify CLI
        run: python -m sapera doctor
      - name: Verify release files
        run: python tools/audit_release.py
      - name: Build distribution
        run: python -m build
